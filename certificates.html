<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillTest — Сертифікати</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body data-page="certificates">
    <div class="app-container">
        <aside class="sidebar">
            <div>
                <div class="brand">SkillTest</div>
                <nav class="nav-menu">
                    <a href="index.html" class="nav-item">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z" /></svg>
                        <span>Головна</span>
                    </a>
                    <a href="courses.html" class="nav-item">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></svg>
                        <span>Курси</span>
                    </a>
                    <a href="students.html" class="nav-item">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 10L12 5 2 10l10 5 10-5z" /><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5" /></svg>
                        <span>Студент</span>
                    </a>
                    <a href="teachers.html" class="nav-item">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8" /><path d="M12 16v4" /></svg>
                        <span>Викладач</span>
                    </a>
                    <a href="certificates.html" class="nav-item active">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="5" /><path d="M8.5 13l-1.5 8 5-3 5 3-1.5-8" /></svg>
                        <span>Сертифікати</span>
                    </a>
                </nav>
            </div>
            <a href="index.html" class="logout-btn">
                <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>
                <span>Logout</span>
            </a>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1 class="accent-title">Сертифікати</h1>
                <p>Перелік виданих сертифікатів та перевірка статусів</p>
            </header>

            <section class="content-card">
                <div class="js-panel">
                    <div class="js-toolbar">
                        <strong>Реєстр сертифікатів</strong>
                        <div class="js-controls">
                            <input type="text" id="filterInput" class="js-input" placeholder="Пошук сертифіката...">
                            <button type="button" id="toggleListBtn" class="js-btn">Сховати список</button>
                        </div>
                    </div>

                    <div id="itemsList" class="certificates-list"></div>

                    <form id="addItemForm" class="js-form" novalidate>
                        <input type="text" id="newItemInput" class="js-input" placeholder="Назва нового сертифіката (наприклад: Мережева безпека)...">
                        <button type="submit" class="js-btn js-btn-dark">Додати</button>
                        <div id="formFeedback" class="js-message"></div>
                    </form>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
